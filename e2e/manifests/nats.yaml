# One single-node JetStream server per long-lived environment (core infra in
# a real account). Subjects are taken as declared, so environments must not
# share a server. ENV is substituted by run.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: nats-ENV
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: nats-ENV
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      containers:
        - name: nats
          image: nats:2.15-alpine
          args: [--jetstream, --store_dir=/data, --http_port=8222]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: 8222}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats-ENV
spec:
  selector: {app: nats}
  ports:
    - {name: tcp-client, port: 4222, targetPort: 4222}

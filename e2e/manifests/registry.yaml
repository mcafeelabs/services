# An in-cluster registry at a fixed ClusterIP. Kargo only talks plain HTTP to
# localhost or private-range addresses, so Warehouses subscribe to
# 10.96.200.200:5000/<svc>; the node's containerd is pointed at the same
# address (see run.sh), and the host pushes through the NodePort.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{containerPort: 5000}]
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  clusterIP: 10.96.200.200
  selector: {app: registry}
  ports:
    - {name: http, port: 5000, targetPort: 5000, nodePort: 30500}

# Local stand-ins for an account's secret stores, using ESO's Kubernetes
# provider: localdev-secrets plays Secrets Manager (read-only), and
# localdev-params plays Parameter Store (read, plus PushSecret for dynamic
# outputs). Keys are Secret names (keyStyle: dotted in the env layer).
apiVersion: v1
kind: Namespace
metadata:
  name: secret-store
---
apiVersion: v1
kind: Namespace
metadata:
  name: parameter-store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-store-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-store-review
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eso-store-review}
subjects: [{kind: ServiceAccount, name: eso-store, namespace: external-secrets}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store
  namespace: secret-store
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-store}
subjects: [{kind: ServiceAccount, name: eso-store, namespace: external-secrets}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store
  namespace: parameter-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store
  namespace: parameter-store
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: eso-store}
subjects: [{kind: ServiceAccount, name: eso-store, namespace: external-secrets}]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: localdev-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: external-secrets}
      auth:
        serviceAccount: {name: eso-store, namespace: external-secrets}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: localdev-params
spec:
  provider:
    kubernetes:
      remoteNamespace: parameter-store
      server:
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: external-secrets}
      auth:
        serviceAccount: {name: eso-store, namespace: external-secrets}
---
# Seed values the services reference with $secret and $kv.
apiVersion: v1
kind: Secret
metadata:
  name: orders.payments-api-key
  namespace: secret-store
stringData:
  value: e2e-payments-api-key
---
apiVersion: v1
kind: Secret
metadata:
  name: identity.signing-key
  namespace: secret-store
stringData:
  value: e2e-signing-key
---
apiVersion: v1
kind: Secret
metadata:
  name: orders.flags.checkout-v2
  namespace: parameter-store
stringData:
  value: "true"

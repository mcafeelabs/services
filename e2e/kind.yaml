kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: registry-e2e
nodes:
  - role: control-plane
    extraPortMappings:
      # in-cluster image registry (NodePort) for docker push from the host
      - {containerPort: 30500, hostPort: 5001, protocol: TCP}
      # in-cluster git server (NodePort) for git push from the host
      - {containerPort: 30080, hostPort: 8081, protocol: TCP}

# What this chart supports: the chartProfiles a service may select and the
# resource kinds it may provide. The services repo vendors this file
# (platform/capabilities.yaml) and svcreg rejects manifests that use anything
# else. Keep it in step with templates/.
apiVersion: platform/v1
chartVersion: 0.1.0
profiles:
  - http-api
  - worker
kinds:
  http-endpoint:
    output: deterministic
    value: "http://{{ .Service }}.{{ .Namespace }}.svc.cluster.local"
  nats-subject:
    output: deterministic
    value: "{{ .Name }}"
  sqs-queue:
    output: deterministic
    value: "{{ .Env }}-{{ .Service }}-{{ .Output }}"
  postgres:
    output: dynamic
    defaultSandbox: isolate
    keys: [host, port, database, username, password, uri]

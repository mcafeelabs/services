# A sandbox runs only the services under test; everything else resolves to
# its baseline. Requests carrying baggage sandbox=ryan-checkout-v2 are routed
# into sbx-ryan-checkout-v2 at every hop the sandbox overrides.
name: ryan-checkout-v2
owner: ryan
baseline: dev
ttl: 72h
services:
  - name: orders
    image: orders:pr-1
  - name: payments
    image: payments:pr-1
    values:
      config:
        featureFlags:
          refundsV2: true

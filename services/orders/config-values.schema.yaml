# Published by CI from github.com/mcafeelabs/orders. Do not edit here.
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [http, database, payments, events, nats]
properties:
  log:
    type: object
    properties:
      level: {enum: [debug, info, warn, error]}
  http:
    type: object
    properties:
      port: {type: integer, minimum: 1, maximum: 65535}
  nats:
    type: object
    required: [url]
    properties:
      url: {type: string, pattern: "^nats://"}
  database:
    type: object
    required: [host, port, name, user, password]
    properties:
      host: {type: string, x-ref: [output, kv, literal]}
      port: {type: string, x-ref: [output, kv, literal]}
      name: {type: string, x-ref: [output, kv, literal]}
      user: {type: string, x-ref: [output, secret]}
      # A password can never be committed as a literal.
      password: {type: string, x-ref: [output, secret]}
  payments:
    type: object
    required: [url, apiKey]
    properties:
      url: {type: string, format: uri, pattern: "^https?://"}
      apiKey: {type: string, x-ref: [secret]}
  featureFlags:
    type: object
    properties:
      checkoutV2: {type: string, x-ref: [kv, literal]}
  events:
    type: object
    required: [ordersCreated, stockChanged]
    properties:
      ordersCreated: {type: string}
      stockChanged: {type: string}
      queue: {type: string}
